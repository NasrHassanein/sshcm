name: Ensure rustup
description: >
  Install rustup when the runner image does not ship it (the ARM Linux
  partner image may not). A no-op where rustup is already on PATH.
runs:
  using: composite
  steps:
    - name: Install rustup
      shell: bash
      run: |
        if ! command -v rustup >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
        fi
