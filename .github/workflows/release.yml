# Builds release archives for Linux and macOS (x86_64 and aarch64) when a
# version tag (v*) is pushed, and attaches them to a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install rustup (ARM images may lack it)
        uses: ./.github/actions/ensure-rustup
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage files
        id: stage
        shell: bash
        run: |
          name="sshcm-${GITHUB_REF_NAME}-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/sshcm"
          mkdir -p "$name/completions"
          cp "$bin" install.sh README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "$name/"
          # Completions and the man page need a binary that runs here; the
          # cross-compiled Intel macOS build falls back to a host build.
          host_bin="$bin"
          if ! "$host_bin" --version >/dev/null 2>&1; then
            cargo build --release --locked
            host_bin="target/release/sshcm"
          fi
          for shell in bash zsh fish elvish powershell; do
            "$host_bin" completions "$shell" > "$name/completions/sshcm.$shell"
          done
          "$host_bin" manpage > "$name/sshcm.1"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Archive
        run: |
          tar czf "${{ steps.stage.outputs.name }}.tar.gz" "${{ steps.stage.outputs.name }}"
          shasum -a 256 "${{ steps.stage.outputs.name }}.tar.gz" > "${{ steps.stage.outputs.name }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: sshcm-*.tar.gz*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Notes come from the tag's CHANGELOG.md section (the step fails if
      # there is none), plus download/verify instructions.
      - name: Release notes
        id: notes
        run: |
          .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          name: sshcm ${{ steps.notes.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          # install.sh is also attached on its own, so
          # releases/latest/download/install.sh always matches the latest binaries.
          files: |
            sshcm-*.tar.gz*
            install.sh
