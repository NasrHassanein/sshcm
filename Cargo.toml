[package]
name = "sshcm"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Manage ~/.ssh/config without ever damaging it: lossless parsing, surgical edits, atomic writes."
license = "MIT OR Apache-2.0"
keywords = ["ssh", "config", "cli", "openssh"]
categories = ["command-line-utilities", "config"]
readme = "README.md"
repository = "https://github.com/NasrHassanein/sshcm"
homepage = "https://github.com/NasrHassanein/sshcm"

[lib]
path = "src/lib.rs"

[[bin]]
name = "sshcm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.5"
clap_mangen = "0.2"
home = "0.5"
glob = "0.3"
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
insta = "1"
pretty_assertions = "1"
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
